; DrowsyFW - GOOUUU ESP32-S3-CAM N16R8 (16MB flash, 8MB OPI PSRAM)
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Short core path: Arduino core 3.x libs exceed Windows' 260-char path limit
; under C:\Users\User\.platformio (LongPathsEnabled = 0 on this PC)
core_dir = C:/pio

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Flash 16MB + OPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = app3M_fat9M_16MB.csv  ; OTA slots + 9.9MB FFat, same as reference repo

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

upload_port = COM6
monitor_port = COM6
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
